[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-glowup"
version = "0.1.0"
description = "Score and supercharge any GitHub profile from your terminal — zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aashish Bharti" }]
keywords = ["github", "cli", "profile", "stats", "achievements", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aashishbharti04/github-glowup"
Issues = "https://github.com/aashishbharti04/github-glowup/issues"

[project.scripts]
glowup = "gpp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/gpp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
